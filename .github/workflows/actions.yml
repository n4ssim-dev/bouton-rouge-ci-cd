name: CI/CD

# Pas de déclencheur pull_request : la PR dev → main est validée par les checks
# du push sur dev (même commit), et main n'est modifiable que par cette PR.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/bouton-rouge

jobs:
  # Liste les apps (backend, frontend) modifiées par le push : les jobs suivants ne
  # traitent qu'elles, et si aucune ne l'est il n'y a ni tests, ni image, ni PR, ni déploiement
  changes:
    name: Détection des changements
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.diff.outputs.apps }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          # workflow_dispatch, nouvelle branche ou comparaison impossible : on traite tout
          all=$'backend/\nfrontend/'
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            files=$all
          else
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename') || files=$all
          fi

          apps=()
          for app in backend frontend; do
            if grep -q "^$app/" <<<"$files"; then
              apps+=("$app")
            fi
          done

          json=$(jq -cn '$ARGS.positional' --args "${apps[@]}")
          echo "Apps modifiées : $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Tests unitaires (backend)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.apps), 'backend')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test

  npm-audit:
    name: npm audit (${{ matrix.app }})
    needs: changes
    runs-on: ubuntu-latest
    # Matrice fixe : chaque check requis par la protection de main est toujours rapporté,
    # les étapes sont simplement sautées si l'app n'a pas changé
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    env:
      CHANGED: ${{ contains(fromJSON(needs.changes.outputs.apps), matrix.app) }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - if: env.CHANGED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: env.CHANGED == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - if: env.CHANGED == 'true'
        run: npm audit --audit-level=high

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-scan-push:
    name: Build, Trivy & push (${{ matrix.app }})
    needs: [changes, unit-tests, npm-audit, gitleaks]
    # unit-tests est sauté quand seul le frontend change : on accepte « skipped », pas un échec
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    # Matrice fixe, comme npm-audit : les checks requis sont toujours rapportés
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    env:
      CHANGED: ${{ contains(fromJSON(needs.changes.outputs.apps), matrix.app) }}
    steps:
      - if: env.CHANGED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: env.CHANGED == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        if: env.CHANGED == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Un seul dépôt Docker Hub : l'app est distinguée par le préfixe du tag (backend-latest, frontend-sha-xxx…)
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,prefix=${{ matrix.app }}-
            type=ref,event=pr,prefix=${{ matrix.app }}-pr-
            type=sha,prefix=${{ matrix.app }}-sha-
            type=raw,value=${{ matrix.app }}-latest,enable={{is_default_branch}}

      # Build local de l'image pour la scanner avant tout push
      - name: Build
        if: env.CHANGED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.app }}
          load: true
          push: false
          tags: ${{ matrix.app }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Trivy
        if: env.CHANGED == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.app }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Login Docker Hub
        if: env.CHANGED == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push uniquement si le scan Trivy est passé (le cache évite de tout reconstruire)
      - name: Push
        if: env.CHANGED == 'true' && github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}

  open-pr:
    name: Ouverture PR dev → main
    needs: [changes, build-scan-push]
    # build-scan-push réussit toujours, même sans changement : on vérifie qu'une app a bougé
    if: needs.changes.outputs.apps != '[]' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Une seule PR ouverte à la fois : les pushs suivants sur dev la mettent à jour d'eux-mêmes
      - name: Créer la PR si besoin
        run: |
          existing=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing déjà ouverte, mise à jour avec ${GITHUB_SHA::7}"
            exit 0
          fi
          if [ "$(gh api "repos/$GH_REPO/compare/main...dev" --jq '.ahead_by')" = "0" ]; then
            echo "dev n'a aucun commit d'avance sur main, rien à proposer"
            exit 0
          fi
          gh pr create --base main --head dev \
            --title "Release dev → main (${GITHUB_SHA::7})" \
            --body "Tests, npm audit, Gitleaks et Trivy validés sur \`${GITHUB_SHA::7}\` ; images poussées sur Docker Hub (tags \`*-sha-${GITHUB_SHA::7}\`). Le merge déclenche le déploiement sur la VM."

  deploy:
    name: Déploiement (VM)
    needs: [changes, build-scan-push]
    # Jamais sur pull_request : le runner auto-hébergé exécuterait du code non relu
    if: needs.changes.outputs.apps != '[]' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux]
    env:
      DEPLOY_DIR: /opt/bouton-rouge-nassim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Met à jour la stack du dossier dédié (le .env de la VM n'est pas touché),
      # puis déploie les images *-latest poussées juste avant par build-scan-push
      - name: Déployer
        run: |
          install -m 644 deploy/compose.yaml "$DEPLOY_DIR/compose.yaml"
          install -m 755 deploy/deploy.sh "$DEPLOY_DIR/deploy.sh"
          "$DEPLOY_DIR/deploy.sh"
